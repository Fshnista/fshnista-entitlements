[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fshnista-entitlements"
version = "1.3.0"
description = "Shared platform entitlement checks for FSHNiSTA microservices"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
]

[project.optional-dependencies]
# The PostgREST transport, for services whose own database is not Supabase.
# An extra rather than a hard dependency because httpx is imported lazily
# inside get_subscription_state_via_rest, so a service using only the asyncpg
# transport never needs it. Every service that wants the REST path already
# pins httpx of its own.
rest = [
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["fshnista_entitlements"]